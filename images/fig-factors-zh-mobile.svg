<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" role="img" aria-labelledby="t d"><title id="t">八項加分因素的結果</title><desc id="d">八項加分因素分三組：採計五項（轉向 HBM 加難以回頭的動作、停建或延後新廠、退出 DDR4、近乎相同的客戶審查、1998 至 2002 年卡特爾歷史）；不採計兩項（投資人公開談話、產業會議碰面）；中性一項（寡占市場結構）。</desc><rect width="420" height="620" fill="#f7f5ef"/><text x="20" y="40" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1d2330" text-anchor="start">八項加分因素的結果</text><rect x="10" y="64" width="400" height="234" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="64" width="8" height="234" rx="4" fill="#2f7d4f"/><text x="30" y="96" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#2f7d4f" text-anchor="start">採計（5 項）</text><text x="30" y="126" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">轉向 HBM，加上難以回頭的動作</text><text x="30" y="164" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">停建或延後新廠</text><text x="30" y="202" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">退出 DDR4</text><text x="30" y="240" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">近乎相同的客戶審查（有力支持）</text><text x="30" y="278" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">1998 至 2002 年卡特爾歷史</text><rect x="10" y="308" width="400" height="120" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="308" width="8" height="120" rx="4" fill="#a8322d"/><text x="30" y="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#a8322d" text-anchor="start">不採計（2 項）</text><text x="30" y="370" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">對投資人的公開談話</text><text x="30" y="408" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">在產業會議碰面</text><rect x="10" y="438" width="400" height="82" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="438" width="8" height="82" rx="4" fill="#8a6a12"/><text x="30" y="470" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#8a6a12" text-anchor="start">中性（1 項）</text><text x="30" y="500" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">寡占市場結構</text><text x="20" y="554" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">裁定看的是整體組合，</text><text x="20" y="578" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">不是單一項目。</text><text x="20" y="602" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">圖由本文依裁定第 III.B 節整理。</text></svg>
