<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 882" role="img" aria-labelledby="t d"><title id="t">駁回動議的兩道關卡</title><desc id="d">三步流程：第一關，三家是否做了平行的事，成立；第二關，加分因素加總是否說得通，五項採計；結果，駁回動議不准、案件續行，這不是認定串通。下方並列前案（單一領頭者，更可能是合法行為）與本案（SK hynix 與 Micron 先減產，再加難以收回的決定與客戶審查）。</desc><rect width="1000" height="882" fill="#f7f5ef"/><text x="40" y="60" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="700" fill="#1d2330" text-anchor="start">駁回動議的兩道關卡</text><rect x="24" y="90" width="640" height="162" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="24" y="90" width="8" height="162" rx="4" fill="#1f5f99"/><text x="48" y="130" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1f5f99" text-anchor="start">第一關</text><text x="48" y="168" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">三家是否做了平行的事？</text><text x="48" y="200" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">成立：減產、轉向 HBM、</text><text x="48" y="232" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">退出 DDR4（DDR3 不採計）</text><path d="M344 254 L344 274" stroke="#5b6475" stroke-width="3"/><path d="M336 266 L344 276 L352 266" fill="none" stroke="#5b6475" stroke-width="3"/><rect x="24" y="280" width="640" height="162" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="24" y="280" width="8" height="162" rx="4" fill="#1f5f99"/><text x="48" y="320" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#1f5f99" text-anchor="start">第二關</text><text x="48" y="358" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">加分因素加總，說得通嗎？</text><text x="48" y="390" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">八項中五項採計、</text><text x="48" y="422" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">兩項不採計、一項中性</text><path d="M344 444 L344 464" stroke="#5b6475" stroke-width="3"/><path d="M336 456 L344 466 L352 456" fill="none" stroke="#5b6475" stroke-width="3"/><rect x="24" y="470" width="640" height="162" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="24" y="470" width="8" height="162" rx="4" fill="#2f7d4f"/><text x="48" y="510" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="24" font-weight="700" fill="#2f7d4f" text-anchor="start">結果</text><text x="48" y="548" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">駁回動議不准，案件續行</text><text x="48" y="580" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">這不是認定串通，</text><text x="48" y="612" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="400" fill="#1d2330" text-anchor="start">法官把訴狀指控當作真的</text><rect x="24" y="666" width="460" height="154" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="24" y="666" width="8" height="154" rx="4" fill="#8a6a12"/><text x="48" y="704" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#8a6a12" text-anchor="start">前案（2020 駁回、2022 維持）</text><text x="48" y="740" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">follow the leader：</text><text x="48" y="770" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">單一領頭者，更可能是</text><text x="48" y="800" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">合法的自由市場行為</text><rect x="516" y="666" width="460" height="154" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="516" y="666" width="8" height="154" rx="4" fill="#a8322d"/><text x="540" y="704" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#a8322d" text-anchor="start">本案（2026，訴狀所述）</text><text x="540" y="740" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">SK hynix 與 Micron 先減產，</text><text x="540" y="770" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">再加難以收回的決定</text><text x="540" y="800" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="400" fill="#1d2330" text-anchor="start">與客戶審查</text><text x="40" y="856" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">圖由本文依裁定與前案判決整理。</text></svg>
