<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 724" role="img" aria-labelledby="t d"><title id="t">價格漲幅的四種口徑</title><desc id="d">四種價格口徑的長條圖：傳統 DRAM 一年 +171.8%；合約價各季約 +50%、+93%、+58%；零售價自 2025 年 10 月初 +500%；原告主張 18 個月 +697%。</desc><rect width="1000" height="724" fill="#f7f5ef"/><text x="40" y="60" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="30" font-weight="700" fill="#1d2330" text-anchor="start">價格漲幅的四種口徑</text><rect x="24" y="100" width="952" height="84" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="40" y="136" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">傳統 DRAM 價格</text><text x="40" y="166" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">到 2025 年第三季的一年內</text><rect x="400" y="127" width="113" height="30" rx="6" fill="#1f5f99"/><text x="525" y="150" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1f5f99" text-anchor="start">+171.8%</text><rect x="24" y="198" width="952" height="178" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="40" y="234" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">合約價（每季）</text><text x="240" y="250" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">2025 年第四季</text><rect x="400" y="232" width="32" height="26" rx="6" fill="#1f5f99"/><text x="444" y="254" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1f5f99" text-anchor="start">約 +50%</text><text x="240" y="294" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">2026 年第一季</text><rect x="400" y="276" width="61" height="26" rx="6" fill="#1f5f99"/><text x="473" y="298" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1f5f99" text-anchor="start">+93%</text><text x="240" y="338" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">2026 年第二季</text><rect x="400" y="320" width="38" height="26" rx="6" fill="#1f5f99"/><text x="450" y="342" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1f5f99" text-anchor="start">+58%</text><rect x="24" y="390" width="952" height="84" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="40" y="426" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">零售價</text><text x="40" y="456" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">自 2025 年 10 月初起算</text><rect x="400" y="417" width="329" height="30" rx="6" fill="#a8322d"/><text x="741" y="440" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#a8322d" text-anchor="start">+500%</text><rect x="24" y="488" width="952" height="84" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="40" y="524" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">原告主張總漲幅</text><text x="40" y="554" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">18 個月</text><rect x="400" y="515" width="460" height="30" rx="6" fill="#a8322d"/><text x="872" y="538" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="22" font-weight="700" fill="#a8322d" text-anchor="start">+697%</text><text x="40" y="616" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">起算時間與價格種類不同，</text><text x="40" y="644" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">不能直接相比或相加。</text><text x="40" y="672" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">皆為原告指控與其引用的報導，</text><text x="40" y="700" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="20" font-weight="400" fill="#5b6475" text-anchor="start">圖由本文依裁定整理。</text></svg>
