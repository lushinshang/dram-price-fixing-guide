<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 750" role="img" aria-labelledby="t d"><title id="t">價格漲幅的四種口徑</title><desc id="d">四種價格口徑的長條圖：傳統 DRAM 一年 +171.8%；合約價各季約 +50%、+93%、+58%；零售價自 2025 年 10 月初 +500%；原告主張 18 個月 +697%。</desc><rect width="420" height="750" fill="#f7f5ef"/><text x="20" y="40" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1d2330" text-anchor="start">價格漲幅的四種口徑</text><rect x="10" y="64" width="400" height="108" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="20" y="94" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1d2330" text-anchor="start">傳統 DRAM 價格</text><text x="20" y="120" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">到 2025 年第三季的一年內</text><rect x="20" y="132" width="61" height="24" rx="6" fill="#1f5f99"/><text x="91" y="152" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">+171.8%</text><rect x="10" y="182" width="400" height="208" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="20" y="212" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1d2330" text-anchor="start">合約價（每季）</text><text x="20" y="248" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">2025 年第四季</text><rect x="20" y="256" width="17" height="20" rx="6" fill="#1f5f99"/><text x="47" y="274" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">約 +50%</text><text x="20" y="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">2026 年第一季</text><rect x="20" y="308" width="33" height="20" rx="6" fill="#1f5f99"/><text x="63" y="326" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">+93%</text><text x="20" y="352" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">2026 年第二季</text><rect x="20" y="360" width="20" height="20" rx="6" fill="#1f5f99"/><text x="50" y="378" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">+58%</text><rect x="10" y="400" width="400" height="108" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="20" y="430" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1d2330" text-anchor="start">零售價</text><text x="20" y="456" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">自 2025 年 10 月初起算</text><rect x="20" y="468" width="179" height="24" rx="6" fill="#a8322d"/><text x="209" y="488" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#a8322d" text-anchor="start">+500%</text><rect x="10" y="518" width="400" height="108" rx="10" fill="#ffffff" stroke="#d9d4c7"/><text x="20" y="548" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1d2330" text-anchor="start">原告主張總漲幅</text><text x="20" y="574" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">18 個月</text><rect x="20" y="586" width="250" height="24" rx="6" fill="#a8322d"/><text x="280" y="606" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#a8322d" text-anchor="start">+697%</text><text x="20" y="660" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">起算時間與價格種類不同，</text><text x="20" y="684" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">不能直接相比或相加。</text><text x="20" y="708" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">皆為原告指控與其引用的報導，</text><text x="20" y="732" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">圖由本文依裁定整理。</text></svg>
