<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 915" role="img" aria-labelledby="t d"><title id="t">駁回動議的兩道關卡</title><desc id="d">三步流程：第一關，三家是否做了平行的事，成立；第二關，加分因素加總是否說得通，五項採計；結果，駁回動議不准、案件續行，這不是認定串通。下方並列前案（單一領頭者，更可能是合法行為）與本案（SK hynix 與 Micron 先減產，再加難以收回的決定與客戶審查）。</desc><rect width="420" height="915" fill="#f7f5ef"/><text x="20" y="40" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="26" font-weight="700" fill="#1d2330" text-anchor="start">駁回動議的兩道關卡</text><rect x="10" y="64" width="400" height="141" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="64" width="8" height="141" rx="4" fill="#1f5f99"/><text x="34" y="101" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">第一關</text><text x="34" y="133" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">三家是否做了平行的事？</text><text x="34" y="159" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">成立：減產、轉向 HBM、</text><text x="34" y="185" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">退出 DDR4（DDR3 不採計）</text><path d="M210 207 L210 225" stroke="#5b6475" stroke-width="3"/><path d="M202 217 L210 227 L218 217" fill="none" stroke="#5b6475" stroke-width="3"/><rect x="10" y="231" width="400" height="141" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="231" width="8" height="141" rx="4" fill="#1f5f99"/><text x="34" y="268" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#1f5f99" text-anchor="start">第二關</text><text x="34" y="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">加分因素加總，說得通嗎？</text><text x="34" y="326" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">八項中五項採計、</text><text x="34" y="352" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">兩項不採計、一項中性</text><path d="M210 374 L210 392" stroke="#5b6475" stroke-width="3"/><path d="M202 384 L210 394 L218 384" fill="none" stroke="#5b6475" stroke-width="3"/><rect x="10" y="398" width="400" height="141" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="398" width="8" height="141" rx="4" fill="#2f7d4f"/><text x="34" y="435" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#2f7d4f" text-anchor="start">結果</text><text x="34" y="467" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="700" fill="#1d2330" text-anchor="start">駁回動議不准，案件續行</text><text x="34" y="493" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">這不是認定串通，</text><text x="34" y="519" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">法官把訴狀指控當作真的</text><rect x="10" y="565" width="400" height="141" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="565" width="8" height="141" rx="4" fill="#8a6a12"/><text x="34" y="602" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#8a6a12" text-anchor="start">前案（2020 駁回、2022 維持）</text><text x="34" y="634" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">follow the leader：</text><text x="34" y="660" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">單一領頭者，更可能是</text><text x="34" y="686" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">合法的自由市場行為</text><rect x="10" y="718" width="400" height="141" rx="10" fill="#ffffff" stroke="#d9d4c7"/><rect x="10" y="718" width="8" height="141" rx="4" fill="#a8322d"/><text x="34" y="755" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="21" font-weight="700" fill="#a8322d" text-anchor="start">本案（2026，訴狀所述）</text><text x="34" y="787" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">SK hynix 與 Micron 先減產，</text><text x="34" y="813" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">再加難以收回的決定</text><text x="34" y="839" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#1d2330" text-anchor="start">與客戶審查</text><text x="20" y="893" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif" font-size="18" font-weight="400" fill="#5b6475" text-anchor="start">圖由本文依裁定與前案判決整理。</text></svg>
